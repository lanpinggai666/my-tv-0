name: build-kitkat-release

on:
  workflow_dispatch:
  push:
    branches:
      - kitkat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Release APK
        run: ./gradlew clean && ./gradlew assembleRelease

      - name: Align and Sign APK for Android 4.4
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" app-release-aligned.apk
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mytv -storepass 123456 -keypass 123456 -dname "CN=mytv"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks --ks-key-alias mytv --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --out my-tv-0-kitkat-release.apk app-release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-0-kitkat-release
          path: my-tv-0-kitkat-release.apk
